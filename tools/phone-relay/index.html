<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FocusMate · 手机中转验证</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#153a2c;background:#eef2e9}*{box-sizing:border-box}body{margin:0;padding:28px 18px}main{max-width:540px;margin:auto}.brand{font:600 12px monospace;letter-spacing:2px;color:#627d5a}h1{font-size:28px;line-height:1.3;margin:16px 0 8px}p{line-height:1.7;color:#5e7064;font-size:14px}.card{background:#fff;border:1px solid #d8e1d2;border-radius:18px;padding:20px;margin:20px 0}.status{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #ecf0e8}.status:last-child{border:0}.badge{font-size:12px;padding:6px 10px;border-radius:20px;background:#edf0e9;color:#62715a}.badge.ok{background:#dff4d4;color:#255c25}.badge.bad{background:#ffe7dc;color:#8c3a19}button{font:inherit;cursor:pointer;width:100%;border:0;border-radius:12px;padding:15px;margin:6px 0;background:#254c37;color:#fff;font-weight:600}button.secondary{background:#e1e9da;color:#254c37}button:disabled{opacity:.4;cursor:default}#notice{min-height:24px;font-size:14px;color:#865225}details{margin:22px 0}summary{font-size:13px;cursor:pointer;color:#607660}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.7 monospace;max-height:240px;overflow:auto;background:#142b20;color:#def0ce;border-radius:12px;padding:14px}small{display:block;color:#748470;font-size:11px;line-height:1.8}a{color:#254c37}
</style></head><body><main>
<div class="brand">FOCUSMATE / CONNECT</div><h1>让手机帮设备联网</h1>
<p>这是前台链路验证页，只发送测试编号。连接成功后，再分别验证蓝牙和 HTTPS 往返。</p>
<div class="card"><div class="status"><span>设备连接</span><span class="badge" id="bleState">未连接</span></div>
<div class="status"><span>HTTPS 请求</span><span class="badge" id="httpState">未测试</span></div>
<div class="status"><span>设备收到结果</span><span class="badge" id="ackState">未测试</span></div></div>
<button id="connect">连接 FocusMate</button><button id="ping" class="secondary" disabled>测试蓝牙往返</button>
<button id="internet" class="secondary" disabled>测试 HTTPS 往返</button><button id="disconnect" class="secondary" disabled>断开连接</button>
<p id="notice" role="status" aria-live="polite"></p>
<small>iPhone 需要支持 Web Bluetooth 的浏览器（例如 Bluefy）和 HTTPS 页面。请保持页面在前台；锁屏后台中转、语音识别和 LLM 尚未在此页面实现。</small>
<details><summary>查看验证日志</summary><pre id="log"></pre><button id="copy" class="secondary">复制日志</button></details>
<small>测试服务：HTTPS httpbin.org 回显。不会上传录音、个人任务或 API Key。</small>
</main><script type="module" src="./gateway.js"></script></body></html>
